name: Update live status

# Runs every 5 minutes and on manual trigger.
on:
  repository_dispatch:
    types: [update-live-status]
  workflow_dispatch:

# Allow the workflow to push the updated live-status.json back to the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run updater script
        env:
          TWITCH_CLIENT_ID:     ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python3 scripts/update_live_status.py

      - name: Commit & push (only when changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-status.json
          if git diff --cached --quiet; then
            echo "No change — skipping commit."
          else
            git commit -m "chore: update live status [skip ci]"
            git push
          fi
